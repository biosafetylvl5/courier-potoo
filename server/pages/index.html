!<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POTOO!</title>
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <style>
      body {
        display: flex;
      }
      .gallery {
        display: grid;
        width: 50%;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px
      }

      .gallery img{
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="gallery"
          hx-get="/images"
          hx-trigger="load, every 0.5s"
          hx-swap="innerHTML"> 
    </div>
    <div id="displayed-gif">
      
    </div>
  </body>
</html>
