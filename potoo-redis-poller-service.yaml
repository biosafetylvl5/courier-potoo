apiVersion: runcourier.dev/v1alpha1
kind: Service
metadata:
  name: potoo-redis-poller
  namespace: potoo-redis-poller
  description: polls redis on each new input
  docstring: null
  labels: {}
  annotations: {}
spec:
  broker:
    transport: memory
    max_retries: 5
  run:
    - identifier: data-monitor-file-system-poller-watchdog
      spec:
        kind: data_monitor
        name: file_system_poller_watchdog
        config:
          path: output_dir
          hostname: localhost
    - identifier: job-builder-dummyjobbuilder-redis
      spec:
        kind: job_builder
        name: DummyJobBuilder
        config:
          payload:
            identifier: payload-bash-payload-redis
            spec:
              kind: payload
              name: bash_payload
              config:
                toolchain: ["redis-cli", "base64"]
                script: |
                  IMG=$(cat {{ files[0].file }} | base64)
                  FILE=$(basename {{ files[0].file }})
                  TAG="${FILE%%.*}"
                  redis-cli -h redis hsetnx $TAG processed false
                  cat {{ files[0].file }} | base64 | redis-cli -h redis -x hset $TAG image
    - identifier: dispatcher-local-dispatcher
      spec:
        kind: dispatcher
        name: local_dispatcher
        config: null
  allow_implicit_target: true
  service_config:
    service_id: watcher-service-57bb51c7
    namespace: default
    prometheus_port: 8000
    broker_url: amqp://admin:admin@localhost:5672/
    broker_max_retries: 5
    broker_prefetch_count: 1
    broker_max_redeliveries: 3
    heartbeat_interval: 30
    plugin_restart_delay: 5
    plugin_max_restart_attempts: 3
    plugin_health_check_interval: 2
    loki_url: ''
    loki_enabled: false
    log_level: DEBUG
    production_mode: false
    tracing_enabled: true
    tracing_endpoint: http://localhost:4318/v1/traces
    tracing_service_name: ''
    tracing_sample_rate: 1.0
